# nginx vhost for https://visualizer.dikarya.us/. Install as
#   /etc/nginx/sites-enabled/visualizer.dikarya.us.conf
# (dikarya.us's nginx.conf includes sites-enabled/* inside http{}, and not
# conf.d). The TLS block needs the certificate to exist first; deploy/setup.sh
# obtains it before installing this file.

# On-demand OSM tile cache. Tiles are kept up to 90 days since last use and the
# least recently used are evicted past max_size. The server's disk is shared
# with other sites, so keep max_size small.
proxy_cache_path /var/cache/nginx/osm-tiles levels=1:2 keys_zone=osmtiles:20m
                 max_size=5g inactive=90d use_temp_path=off;

# Per-client limit for the query API (tiles and static files are not limited).
limit_req_zone $binary_remote_addr zone=inatviz:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name visualizer.dikarya.us;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://visualizer.dikarya.us$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name visualizer.dikarya.us;

    ssl_certificate /etc/letsencrypt/live/visualizer.dikarya.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visualizer.dikarya.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    limit_req_status 429;
    # A location with its own add_header drops these, so the tile location
    # repeats them.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app trusts only this local proxy; overwrite any client-supplied XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        gzip on;
        gzip_types application/json text/csv application/javascript text/css;
        # The app sets X-Content-Type-Options and Referrer-Policy itself.
    }

    location /api/ {
        limit_req zone=inatviz burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        gzip on;
        gzip_types application/json text/csv;
    }

    # OpenStreetMap tiles, fetched on demand and cached on disk. Per the OSM
    # tile usage policy (https://operations.osmfoundation.org/policies/tiles/):
    # identify the app, honour caching, show attribution (Leaflet does), and
    # never bulk pre-download tiles.
    location ~ ^/tiles/(\d+)/(\d+)/(\d+)\.png$ {
        # proxy_pass with variables resolves the host at request time.
        resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
        resolver_timeout 5s;
        proxy_pass https://tile.openstreetmap.org/$1/$2/$3.png;
        proxy_ssl_server_name on;
        proxy_ssl_name tile.openstreetmap.org;
        proxy_http_version 1.1;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "iNatSeasonalVisualizer/1.0 (+https://visualizer.dikarya.us/)";
        proxy_set_header Referer "https://visualizer.dikarya.us/";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        # Freshness follows OSM's Cache-Control. Expired tiles stay on disk
        # (see `inactive` above) and are revalidated with a conditional request,
        # so the cache keeps growing without re-downloading unchanged tiles.
        proxy_cache osmtiles;
        proxy_cache_key $uri;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1h;
        # If OSM rate-limits or blocks the server, serve tiles already on disk
        # and keep the error briefly so every client request does not hit OSM.
        proxy_cache_valid 403 429 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504
                              http_403 http_429;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_revalidate on;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Cache-Status $upstream_cache_status always;
        expires 7d;
    }
}
