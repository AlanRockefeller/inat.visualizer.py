# server{}-level locations for https://dikarya.us/visualizer/.
# Install as /etc/nginx/snippets/inat-visualizer.conf and add
#     include snippets/inat-visualizer.conf;
# inside the existing dikarya.us `server { listen 443 ssl; ... }` block.
# Requires deploy/nginx-visualizer-http.conf in conf.d.

location = /visualizer {
    return 301 /visualizer/;
}

location /visualizer/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    gzip on;
    gzip_types application/json text/csv application/javascript text/css;
    # No add_header here: one inside a location replaces every header
    # inherited from the server block (such as Strict-Transport-Security).
    # The app sets X-Content-Type-Options and Referrer-Policy itself.
}

location /visualizer/api/ {
    limit_req zone=inatviz burst=20 nodelay;
    proxy_pass http://127.0.0.1:8765/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    gzip on;
    gzip_types application/json text/csv;
}

# OpenStreetMap tiles, fetched on demand and cached on disk. Per the OSM tile
# usage policy (https://operations.osmfoundation.org/policies/tiles/): identify
# the app, honour caching, show attribution (Leaflet does), and never bulk
# pre-download tiles.
location ~ ^/visualizer/tiles/(\d+)/(\d+)/(\d+)\.png$ {
    # proxy_pass with variables resolves the host at request time.
    resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 5s;
    proxy_pass https://tile.openstreetmap.org/$1/$2/$3.png;
    proxy_ssl_server_name on;
    proxy_ssl_name tile.openstreetmap.org;
    proxy_http_version 1.1;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_set_header User-Agent "iNatSeasonalVisualizer/1.0 (+https://dikarya.us/visualizer/)";
    proxy_set_header Referer "https://dikarya.us/visualizer/";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;

    # Freshness follows OSM's Cache-Control. Expired tiles stay on disk (see
    # `inactive` in the http conf) and are revalidated with a conditional
    # request, so the cache keeps growing without re-downloading unchanged tiles.
    proxy_cache osmtiles;
    proxy_cache_key $uri;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1h;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_revalidate on;

    # add_header in a location drops the headers inherited from the server
    # block, so re-declare any server-wide headers (e.g. HSTS) here as well.
    add_header X-Cache-Status $upstream_cache_status always;
    expires 7d;
}
