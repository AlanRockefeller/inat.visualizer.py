# http{}-level pieces for the web visualizer. Install as
#   /etc/nginx/conf.d/inat-visualizer.conf
# (files in conf.d are included inside http{} on Ubuntu).

# On-demand OSM tile cache. Tiles are kept up to 90 days since last use and the
# least recently used are evicted past max_size. Adjust max_size to spare disk.
proxy_cache_path /var/cache/nginx/osm-tiles levels=1:2 keys_zone=osmtiles:100m
                 max_size=30g inactive=90d use_temp_path=off;

# Per-client limit for the query API (tiles and static files are not limited).
limit_req_zone $binary_remote_addr zone=inatviz:10m rate=2r/s;
limit_req_status 429;
